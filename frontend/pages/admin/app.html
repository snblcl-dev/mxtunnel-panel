<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel — Aplicación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
<div class="app-layout">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <%~ include('admin-sidebar', it) %>
  <main class="app-main">
    <div class="page-header">
      <div>
        <h3>Aplicación</h3>
        <div class="text-muted">Configuración de la app móvil</div>
      </div>
    </div>
    <div class="card fade-in">
      <div class="card-header"><i class="bi bi-palette me-2"></i>Temas</div>
      <div class="card-body">
        <div class="alert alert-secondary d-flex align-items-center gap-2">
          <i class="bi bi-info-circle"></i>
          <span>Cada usuario gestiona sus temas en su sección <strong>Aplicación</strong>. Si un usuario no activa un tema, la app usa el <strong>tema por defecto embebido</strong> en la propia app.</span>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
