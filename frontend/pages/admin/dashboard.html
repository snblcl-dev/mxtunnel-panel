<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel — Inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
<div class="app-layout">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <%~ include('admin-sidebar', it) %>

  <main class="app-main">
    <div class="page-header">
      <div>
        <h3>Inicio</h3>
        <div class="text-muted">Resumen general del panel</div>
      </div>
      <a href="/admin/users" class="btn btn-primary">
        <i class="bi bi-people me-2"></i>Gestionar usuarios
      </a>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="stat-card fade-in">
          <div class="icon-box indigo"><i class="bi bi-people-fill"></i></div>
          <div>
            <div class="label">Usuarios</div>
            <div class="value"><%= it.stats.users %></div>
            <div class="sub">Cuentas registradas</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card fade-in">
          <div class="icon-box success"><i class="bi bi-hdd-rack-fill"></i></div>
          <div>
            <div class="label">Servidores</div>
            <div class="value"><%= it.stats.servers %></div>
            <div class="sub">Configs activas</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card fade-in">
          <div class="icon-box warning"><i class="bi bi-folder-fill"></i></div>
          <div>
            <div class="label">Categorías</div>
            <div class="value"><%= it.stats.categories %></div>
            <div class="sub">Agrupaciones</div>
          </div>
        </div>
      </div>
    </div>

    <div class="chart-card fade-in">
      <h6><i class="bi bi-bar-chart-line me-2"></i>Distribución</h6>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/app.js"></script>
<script>
  new Chart(document.getElementById('chart'), {
    type: 'doughnut',
    data: {
      labels: ['Usuarios', 'Servidores', 'Categorías'],
      datasets: [{
        data: [<%= it.stats.users %>, <%= it.stats.servers %>, <%= it.stats.categories %>],
        backgroundColor: ['#818CF8', '#10B981', '#F59E0B'],
        borderColor: '#1E293B',
        borderWidth: 3,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#94A3B8', font: { size: 12 }, padding: 16 } },
      },
      cutout: '65%',
    }
  });
</script>
</body>
</html>
