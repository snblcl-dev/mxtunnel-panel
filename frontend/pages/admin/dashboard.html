<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel — Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="d-flex">
  <%~ include('admin-sidebar', it) %>
  <main class="flex-grow-1 p-4">
    <h3>Inicio</h3>
    <p class="text-muted">Resumen general del panel.</p>

    <div class="row g-3">
      <div class="col-md-4">
        <div class="card text-bg-primary"><div class="card-body">
          <h5 class="card-title">Usuarios</h5>
          <p class="display-6 mb-0"><%= it.stats.users %></p>
        </div></div>
      </div>
      <div class="col-md-4">
        <div class="card text-bg-success"><div class="card-body">
          <h5 class="card-title">Servidores</h5>
          <p class="display-6 mb-0"><%= it.stats.servers %></p>
        </div></div>
      </div>
      <div class="col-md-4">
        <div class="card text-bg-warning"><div class="card-body">
          <h5 class="card-title">Categorías</h5>
          <p class="display-6 mb-0"><%= it.stats.categories %></p>
        </div></div>
      </div>
    </div>

    <div class="mt-4">
      <a href="/admin/users" class="btn btn-primary">Gestionar usuarios</a>
    </div>
  </main>
</div>
</body>
</html>
