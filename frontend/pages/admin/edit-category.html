<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel Panel — Editar categoría</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">MXTunnel Panel</a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
      <h4>Editar categoría</h4>
      <a href="/admin/users/<%= it.user.id %>/config" class="btn btn-outline-secondary btn-sm">Volver</a>
    </div>
    <p class="text-muted">Usuario: <%= it.user.username %></p>

    <div class="card">
      <div class="card-body">
        <form method="POST" action="/admin/users/<%= it.user.id %>/categories/<%= it.category.id %>">
          <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
          <input type="hidden" name="action" value="update" />
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label">Nombre</label>
              <input class="form-control" name="name" value="<%= it.category.name %>" required />
            </div>
            <div class="col-md-3">
              <label class="form-label">Color</label>
              <input class="form-control" name="color" type="color" value="<%= it.category.color %>" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Orden</label>
              <input class="form-control" name="sorter" type="number" value="<%= it.category.sorter %>" />
            </div>
            <div class="col-12">
              <button class="btn btn-primary">Guardar cambios</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
