<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel Panel — Editar servidor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">MXTunnel Panel</a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
      <h4>Editar servidor: <%= it.server.name %></h4>
      <a href="/admin/users/<%= it.user.id %>/config" class="btn btn-outline-secondary btn-sm">Volver</a>
    </div>
    <p class="text-muted">Usuario: <%= it.user.username %></p>

    <div class="card">
      <div class="card-body">
        <form method="POST" action="/admin/users/<%= it.user.id %>/servers/<%= it.server.id %>">
          <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
          <input type="hidden" name="action" value="update" />
          <div class="row g-2">
            <div class="col-md-4"><label class="form-label">Nombre</label><input class="form-control" name="name" value="<%= it.server.name %>" required /></div>
            <div class="col-md-4">
              <label class="form-label">Categoría</label>
              <select class="form-select" name="category_id" required>
                <% it.categories.forEach(function(c) { %>
                  <option value="<%= c.id %>" <%= c.id === it.server.category_id ? 'selected' : '' %>><%= c.name %></option>
                <% }) %>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label">Tipo</label>
              <select class="form-select" name="tunnel_type">
                <option value="1"  <%= it.server.tunnel_type === 1  ? 'selected' : '' %>>SSH Directo</option>
                <option value="2"  <%= it.server.tunnel_type === 2  ? 'selected' : '' %>>SSH Proxy</option>
                <option value="3"  <%= it.server.tunnel_type === 3  ? 'selected' : '' %>>SSH SSL</option>
                <option value="4"  <%= it.server.tunnel_type === 4  ? 'selected' : '' %>>SSL Payload</option>
                <option value="5"  <%= it.server.tunnel_type === 5  ? 'selected' : '' %>>SlowDNS</option>
                <option value="6"  <%= it.server.tunnel_type === 6  ? 'selected' : '' %>>SSL RP</option>
                <option value="7"  <%= it.server.tunnel_type === 7  ? 'selected' : '' %>>SSH</option>
                <option value="8"  <%= it.server.tunnel_type === 8  ? 'selected' : '' %>>RE</option>
                <option value="9"  <%= it.server.tunnel_type === 9  ? 'selected' : '' %>>UDP</option>
                <option value="10" <%= it.server.tunnel_type === 10 ? 'selected' : '' %>>V2Ray</option>
                <option value="11" <%= it.server.tunnel_type === 11 ? 'selected' : '' %>>Psiphon</option>
              </select>
            </div>
            <div class="col-md-2"><label class="form-label">Orden</label><input class="form-control" name="sorter" type="number" value="<%= it.server.sorter %>" /></div>

            <div class="col-12"><strong class="small text-muted">SSH</strong></div>
            <div class="col-md-3"><label class="form-label">Host</label><input class="form-control" name="ssh_server" value="<%= it.server.ssh_server %>" /></div>
            <div class="col-md-2"><label class="form-label">Puerto</label><input class="form-control" name="ssh_port" value="<%= it.server.ssh_port %>" /></div>
            <div class="col-md-3"><label class="form-label">Usuario</label><input class="form-control" name="ssh_user" value="<%= it.server.ssh_user %>" /></div>
            <div class="col-md-4"><label class="form-label">Contraseña</label><input class="form-control" name="ssh_pass" value="<%= it.server.ssh_pass %>" /></div>

            <div class="col-12"><strong class="small text-muted">SSL / Payload / Proxy</strong></div>
            <div class="col-md-3"><label class="form-label">SNI</label><input class="form-control" name="custom_sni" value="<%= it.server.custom_sni %>" /></div>
            <div class="col-md-6"><label class="form-label">Payload</label><input class="form-control" name="proxy_payload" value="<%= it.server.proxy_payload %>" /></div>
            <div class="col-md-3"><label class="form-label">Puerto local</label><input class="form-control" name="local_port" value="<%= it.server.local_port %>" /></div>
            <div class="col-md-3"><label class="form-label">Proxy IP</label><input class="form-control" name="proxy_ip" value="<%= it.server.proxy_ip %>" /></div>
            <div class="col-md-2"><label class="form-label">Proxy puerto</label><input class="form-control" name="proxy_port" value="<%= it.server.proxy_port %>" /></div>

            <div class="col-12"><strong class="small text-muted">DNS</strong></div>
            <div class="col-md-4"><label class="form-label">DNS 1</label><input class="form-control" name="dns_resolver1" value="<%= it.server.dns_resolver1 %>" /></div>
            <div class="col-md-4"><label class="form-label">DNS 2</label><input class="form-control" name="dns_resolver2" value="<%= it.server.dns_resolver2 %>" /></div>
            <div class="col-md-4"><label class="form-label">UDP resolver</label><input class="form-control" name="udp_resolver" value="<%= it.server.udp_resolver %>" /></div>

            <div class="col-12"><strong class="small text-muted">DNSTT / UDP</strong></div>
            <div class="col-md-3"><label class="form-label">UDP server</label><input class="form-control" name="udp_server" value="<%= it.server.udp_server %>" /></div>
            <div class="col-md-3"><label class="form-label">UDP puerto</label><input class="form-control" name="udp_port" value="<%= it.server.udp_port %>" /></div>
            <div class="col-md-3"><label class="form-label">UDP SNI</label><input class="form-control" name="udp_sni" value="<%= it.server.udp_sni %>" /></div>
            <div class="col-md-3"><label class="form-label">UDP version</label><input class="form-control" name="udp_version" value="<%= it.server.udp_version %>" /></div>

            <div class="col-12"><strong class="small text-muted">V2Ray / Psiphon</strong></div>
            <div class="col-md-6"><label class="form-label">v2ray JSON</label><textarea class="form-control" name="v2ray_json" rows="2"><%= it.server.v2ray_json %></textarea></div>
            <div class="col-md-3"><label class="form-label">Psiphon región</label><input class="form-control" name="psi_region" value="<%= it.server.psi_region %>" /></div>
            <div class="col-md-3"><label class="form-label">Psiphon server</label><input class="form-control" name="psi_server_entry" value="<%= it.server.psi_server_entry %>" /></div>

            <div class="col-12">
              <button class="btn btn-primary">Guardar cambios</button>
              <a href="/admin/users/<%= it.user.id %>/config" class="btn btn-link">Cancelar</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
