<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel — Perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
<div class="app-layout">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <%~ include('admin-sidebar', it) %>

  <main class="app-main">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9 col-xl-7">
        <div class="page-header">
          <div>
            <h3>Perfil</h3>
            <div class="text-muted">Tu información de cuenta (admin)</div>
          </div>
        </div>

        <div class="profile-section fade-in">
          <h6><i class="bi bi-person me-2"></i>Datos de la cuenta</h6>
          <dl class="dl-info row mb-0">
            <dt class="col-sm-4">Usuario</dt><dd class="col-sm-8"><%= it.me.username %></dd>
            <dt class="col-sm-4">Email</dt><dd class="col-sm-8"><%= it.me.email %></dd>
          </dl>
          <div class="mt-3">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
              <span class="token-highlight"><code><%= it.me.id %></code></span>
              <button class="btn btn-sm btn-outline-primary" onclick="copyText('<%= it.me.id %>')">
                <i class="bi bi-clipboard me-1"></i>Copiar
              </button>
            </div>
          </div>
        </div>

        <div class="profile-section fade-in">
          <h6><i class="bi bi-envelope me-2"></i>Cambiar email</h6>
          <form method="POST" action="/admin/profile" data-ajax="true">
            <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
            <input type="hidden" name="action" value="update_email" />
            <div class="mb-2"><input class="form-control" type="email" name="email" value="<%= it.me.email %>" required /></div>
            <button class="btn btn-primary btn-sm"><i class="bi bi-check-lg me-1"></i>Actualizar email</button>
          </form>
        </div>

        <div class="profile-section fade-in">
          <h6><i class="bi bi-lock me-2"></i>Cambiar contraseña</h6>
          <form method="POST" action="/admin/profile" data-ajax="true">
            <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
            <input type="hidden" name="action" value="update_password" />
            <div class="mb-2"><input class="form-control" type="password" name="current_password" placeholder="Contraseña actual" required /></div>
            <div class="mb-2"><input class="form-control" type="password" name="new_password" placeholder="Nueva contraseña (mín. 6)" required minlength="6" /></div>
            <div class="mb-2"><input class="form-control" type="password" name="confirm_password" placeholder="Confirmar nueva contraseña" required minlength="6" /></div>
            <button class="btn btn-primary btn-sm"><i class="bi bi-check-lg me-1"></i>Actualizar contraseña</button>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
