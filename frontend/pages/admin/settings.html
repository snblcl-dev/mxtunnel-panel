<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel — Ajustes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
<div class="app-layout">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <%~ include('admin-sidebar', it) %>

  <main class="app-main">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9 col-xl-7">
        <div class="page-header">
          <div>
            <h3>Ajustes</h3>
            <div class="text-muted">Configuración general del panel</div>
          </div>
        </div>

        <div class="profile-section fade-in">
          <h6><i class="bi bi-person-plus me-2"></i>Registro de usuarios</h6>
          <p class="text-muted mb-3 small">Habilita o deshabilita el registro público de nuevos usuarios del panel.</p>
          <form method="POST" action="/admin/settings" data-ajax="true">
            <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
            <input type="hidden" name="action" value="registration" />
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
              <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" name="registration_enabled" value="true" id="registrationEnabled" <%= it.registrationEnabled ? 'checked' : '' %> />
                <label class="form-check-label" for="registrationEnabled">Permitir registro de usuarios</label>
              </div>
              <button class="btn btn-primary btn-sm"><i class="bi bi-check-lg me-1"></i>Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
