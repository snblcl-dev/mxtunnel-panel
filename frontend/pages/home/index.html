<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel Panel — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <div class="app-layout">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="app-sidebar">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.3 7.7V5.4a2.7 2.7 0 0 1 5.4 0v2.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4.8 7.4H11.2a1.9 1.9 0 0 1 1.9 1.9v3.6a1.9 1.9 0 0 1-1.9 1.9H4.8a1.9 1.9 0 0 1-1.9-1.9V9.3a1.9 1.9 0 0 1 1.9-1.9Z" fill="currentColor"/><circle cx="8" cy="10.4" r="1.3" style="fill:var(--bg-3)"/><path d="M7.45 11.55a0.55 0.55 0 0 1 1.1 0v1.45a0.55 0.55 0 0 1-1.1 0Z" style="fill:var(--bg-3)"/></svg></span>
        <span>MXTunnel</span>
      </div>
      <div class="user-tag">panel</div>
      <div class="sidebar-footer">
        <form method="POST" action="/logout" class="m-0">
          <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
          <button class="btn btn-secondary" type="submit"><i class="bi bi-box-arrow-right me-2"></i>Salir</button>
        </form>
      </div>
    </div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <h3>Inicio</h3>
          <div class="text-muted">Resumen general del panel</div>
        </div>
        <a href="/admin/users" class="btn btn-primary"><i class="bi bi-people me-2"></i>Gestionar usuarios</a>
      </div>

      <div class="row g-3">
        <div class="col-md-4">
          <div class="stat-card fade-in">
            <div class="icon-box"><i class="bi bi-people-fill"></i></div>
            <div><div class="label">Usuarios</div><div class="value"><%= it.stats.users %></div><div class="sub">cuentas registradas</div></div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card fade-in">
            <div class="icon-box success"><i class="bi bi-hdd-rack-fill"></i></div>
            <div><div class="label">Servidores</div><div class="value"><%= it.stats.servers %></div><div class="sub">configs activas</div></div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card fade-in">
            <div class="icon-box warning"><i class="bi bi-folder-fill"></i></div>
            <div><div class="label">Categorías</div><div class="value"><%= it.stats.categories %></div><div class="sub">agrupaciones</div></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
