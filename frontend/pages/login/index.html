<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel Panel — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
<div class="login-shell">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="login-card fade-in">
    <div class="brand-row">
      <span class="brand-mark"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.3 7.7V5.4a2.7 2.7 0 0 1 5.4 0v2.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4.8 7.4H11.2a1.9 1.9 0 0 1 1.9 1.9v3.6a1.9 1.9 0 0 1-1.9 1.9H4.8a1.9 1.9 0 0 1-1.9-1.9V9.3a1.9 1.9 0 0 1 1.9-1.9Z" fill="currentColor"/><circle cx="8" cy="10.4" r="1.3" style="fill:var(--bg-3)"/><path d="M7.45 11.55a0.55 0.55 0 0 1 1.1 0v1.45a0.55 0.55 0 0 1-1.1 0Z" style="fill:var(--bg-3)"/></svg></span>
      <span>MXTunnel</span>
    </div>
    <p class="subtitle">Iniciar sesión en tu panel</p>

    <% if (it.error) { %>
    <div class="alert alert-danger fade-in" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i><%= it.error %>
    </div>
    <% } %>

    <form method="POST" action="/login">
      <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-envelope me-1"></i>Email</label>
        <input type="email" name="email" class="form-control" placeholder="tu@email.com" required autofocus />
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="bi bi-lock me-1"></i>Contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </form>

    <% if (!it.disabled) { %>
    <div class="text-center mt-3">
      <a href="/register" class="small text-muted">¿No tienes cuenta? Regístrate</a>
    </div>
    <% } %>
  </div>
</div>
</body>
</html>
