<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel Panel — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
<div class="login-shell">
  <div class="login-card fade-in">
    <div class="brand-row">
      <i class="bi bi-shield-lock-fill"></i>
      <span>MXTunnel</span>
    </div>
    <p class="subtitle">Iniciar sesión en tu panel</p>

    <form method="POST" action="/login">
      <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-envelope me-1"></i>Email</label>
        <input type="email" name="email" class="form-control" placeholder="tu@email.com" required autofocus />
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="bi bi-lock me-1"></i>Contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </form>
  </div>
</div>
</body>
</html>
