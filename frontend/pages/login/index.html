<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel Panel — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { max-width: 400px; width: 100%; border-radius: 1rem; }
  </style>
</head>
<body>
  <div class="card shadow-lg p-4">
    <h4 class="text-center mb-1">MXTunnel Panel</h4>
    <p class="text-center text-muted mb-4">Iniciar sesión</p>
    <form method="POST" action="/login">
      <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>
</body>
</html>
