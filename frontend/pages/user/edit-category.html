<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel — Editar categoría</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
<div class="app-layout">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <%~ include('sidebar', it) %>

  <main class="app-main">
    <div class="page-header">
      <div>
        <h3>Editar categoría</h3>
      </div>
      <a href="/user/categories" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Volver</a>
    </div>

    <div class="card fade-in" style="max-width: 720px;">
      <div class="card-body">
        <form method="POST" action="/user/categories/<%= it.category.id %>">
          <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
          <input type="hidden" name="action" value="update" />
          <div class="row g-2">
            <div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="name" value="<%= it.category.name %>" required /></div>
            <div class="col-md-3"><label class="form-label">Color</label><input class="form-control" name="color" type="color" value="<%= it.category.color %>" /></div>
            <div class="col-md-3"><label class="form-label">Orden</label><input class="form-control" name="sorter" type="number" value="<%= it.category.sorter %>" /></div>
            <div class="col-12"><button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar cambios</button></div>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
</body>
</html>
