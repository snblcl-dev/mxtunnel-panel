<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel — Editar categoría</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="d-flex">
  <%~ include('sidebar', it) %>
  <main class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center">
      <h3>Editar categoría</h3>
      <a href="/user/categories" class="btn btn-outline-secondary btn-sm">Volver</a>
    </div>

    <div class="card mt-3">
      <div class="card-body">
        <form method="POST" action="/user/categories/<%= it.category.id %>">
          <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
          <input type="hidden" name="action" value="update" />
          <div class="row g-2">
            <div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="name" value="<%= it.category.name %>" required /></div>
            <div class="col-md-3"><label class="form-label">Color</label><input class="form-control" name="color" type="color" value="<%= it.category.color %>" /></div>
            <div class="col-md-3"><label class="form-label">Orden</label><input class="form-control" name="sorter" type="number" value="<%= it.category.sorter %>" /></div>
            <div class="col-12"><button class="btn btn-primary">Guardar cambios</button></div>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
</body>
</html>
