<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXTunnel — Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="d-flex">
  <%~ include('sidebar', it) %>
  <main class="flex-grow-1 p-4" style="max-width:720px">
    <h3>Perfil</h3>
    <p class="text-muted">Tu información de cuenta.</p>

    <div class="card mb-3">
      <div class="card-header">Datos de la cuenta</div>
      <div class="card-body">
        <dl class="row mb-0">
          <dt class="col-sm-3">Usuario</dt><dd class="col-sm-9"><%= it.me.username %></dd>
          <dt class="col-sm-3">Email</dt><dd class="col-sm-9"><%= it.me.email %></dd>
          <dt class="col-sm-3">Token (UUID)</dt><dd class="col-sm-9"><code><%= it.me.id %></code></dd>
        </dl>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-header">Cambiar email</div>
      <div class="card-body">
        <form method="POST" action="/user/profile">
          <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
          <input type="hidden" name="action" value="update_email" />
          <div class="mb-2"><input class="form-control" type="email" name="email" value="<%= it.me.email %>" required /></div>
          <button class="btn btn-primary btn-sm">Actualizar email</button>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Cambiar contraseña</div>
      <div class="card-body">
        <form method="POST" action="/user/profile">
          <input type="hidden" name="_csrf" value="<%= it.csrfToken %>" />
          <input type="hidden" name="action" value="update_password" />
          <div class="mb-2"><input class="form-control" type="password" name="current_password" placeholder="Contraseña actual" required /></div>
          <div class="mb-2"><input class="form-control" type="password" name="new_password" placeholder="Nueva contraseña (mín. 6)" required minlength="6" /></div>
          <div class="mb-2"><input class="form-control" type="password" name="confirm_password" placeholder="Confirmar nueva contraseña" required minlength="6" /></div>
          <button class="btn btn-primary btn-sm">Actualizar contraseña</button>
        </form>
      </div>
    </div>
  </main>
</div>
</body>
</html>
