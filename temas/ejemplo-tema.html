<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MXTunnel</title>
<style>
:root{
  --bg:#0E0A1F;--bg2:#1A1230;--card:#211743;--card2:#2A1E56;--line:#3B2C77;
  --txt:#F1EDFF;--sub:#A79BD8;--muted:#6E63A6;
  --accent:#8B5CF6;--accent2:#6366F1;--green:#22C55E;--red:#EF4444;--amber:#F59E0B;
  --r:18px;
  --grad:linear-gradient(135deg,#8B5CF6,#6366F1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit;color:inherit;background:none;border:none;outline:none}
input::placeholder{color:var(--muted)}
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.brand .mark{width:28px;height:28px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.45)}
.state{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.state .led{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.content{flex:1;overflow-y:auto;padding:8px 16px 90px;-webkit-overflow-scrolling:touch}
.power-wrap{display:flex;flex-direction:column;align-items:center;padding:30px 0 16px}
.power{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:46px;background:var(--card2);border:2px solid var(--line);color:var(--accent);transition:all .2s;box-shadow:0 0 0 6px rgba(139,92,246,.12)}
.power.conn{background:var(--green);border-color:transparent;color:#fff;box-shadow:0 0 40px rgba(34,197,94,.45)}
.power:active{transform:scale(.95)}
.power-label{font-size:18px;font-weight:700;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row .lbl{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.row .val{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;margin-bottom:10px;box-shadow:0 6px 18px rgba(139,92,246,.35)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.input-lbl{display:block;font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px}
.input{width:100%;padding:12px 14px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-size:15px}
.bottom-nav{position:absolute;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-around;padding:8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.nav-btn{flex:1;padding:10px;border-radius:999px;text-align:center;font-size:13px;font-weight:600;color:var(--sub)}
.nav-btn.active{background:var(--grad);color:#fff}
.overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{width:100%;max-width:480px;max-height:88vh;background:var(--bg2);border-radius:24px 24px 0 0;padding:16px;overflow-y:auto}
.sheet h3{font-size:18px;margin-bottom:12px}
.m-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:13px;margin-bottom:6px;background:var(--card)}
.m-item:active{background:var(--line)}
.m-item .ic{font-size:18px}
.m-item .tx{flex:1;font-weight:600}
.srv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:13px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.srv:active{transform:scale(.99)}
.srv .nm{font-weight:700}
.srv .ct{font-size:11px;color:var(--sub);margin-top:2px}
.cat{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin:14px 6px 8px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);padding:11px 18px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:500}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.log{font:12px/1.45 ui-monospace,Menlo,monospace;padding:8px 12px;border-bottom:1px solid var(--line)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="brand"><span class="mark">&#128270;</span>MXTunnel</div>
    <div class="state"><span class="led" id="led"></span><span id="statusTxt">Inactivo</span></div>
  </header>

  <main class="content">
    <div class="power-wrap">
      <button class="power" id="btnPower">&#9889;</button>
      <div class="power-label" id="btnLabel">Conectar</div>
    </div>

    <button class="card row" id="cardServer" style="width:100%">
      <div>
        <div class="lbl">Servidor actual</div>
        <div class="val" id="srvName">Seleccionar servidor</div>
      </div>
      <span style="color:var(--sub)">&#8250;</span>
    </button>

    <div class="card">
      <div class="lbl" style="margin-bottom:6px">Cuenta</div>
      <input class="input" id="inUser" placeholder="Usuario" autocomplete="off">
      <input class="input" id="inPass" type="password" placeholder="Contraseña" style="margin-top:8px" autocomplete="off">
    </div>

    <button class="btn ghost" id="btnUpdate">&#8635; Actualizar</button>
    <button class="btn" id="btnMenu">&#9776; Menú</button>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="navHome">Inicio</button>
    <button class="nav-btn" id="navLogs">Registro</button>
  </nav>

  <!-- Modal servidores -->
  <div class="overlay" id="srvModal">
    <div class="sheet">
      <h3>Servidores</h3>
      <div id="srvList"></div>
      <button class="btn ghost" id="srvClose">Cerrar</button>
    </div>
  </div>

  <!-- Modal registro -->
  <div class="overlay" id="logModal">
    <div class="sheet">
      <h3>Registro</h3>
      <div id="logList"></div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" id="logClear" style="margin-bottom:0">Limpiar</button>
        <button class="btn" id="logClose" style="margin-bottom:0">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal menú -->
  <div class="overlay" id="menuModal">
    <div class="sheet">
      <h3>Menú</h3>
      <div class="m-item" data-act="settings"><span class="ic">&#9881;</span><span class="tx">Ajustes</span></div>
      <div class="m-item" data-act="language"><span class="ic">&#127760;</span><span class="tx">Idioma</span></div>
      <div class="m-item" data-act="dns"><span class="ic">&#128225;</span><span class="tx">DNS</span></div>
      <div class="m-item" data-act="udp"><span class="ic">&#8644;</span><span class="tx">UDPGW</span></div>
      <div class="m-item" data-act="ping"><span class="ic">&#128257;</span><span class="tx">Ping</span></div>
      <div class="m-item" data-act="battery"><span class="ic">&#128267;</span><span class="tx">Batería</span></div>
      <div class="m-item" data-act="hwid"><span class="ic">&#128273;</span><span class="tx">HWID</span></div>
      <div class="m-item" data-act="restore"><span class="ic">&#8634;</span><span class="tx">Restablecer datos</span></div>
      <div class="m-item" data-act="exit"><span class="ic">&#10006;</span><span class="tx">Salir</span></div>
      <button class="btn ghost" id="menuClose">Cerrar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var estado='DISCONNECTED';

function toast(msg){
  $('toast').textContent=msg; $('toast').classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ $('toast').classList.remove('show'); },2400);
}

function aplicarEstado(st){
  estado=st;
  var b=$('btnPower'), l=$('btnLabel'), stT=$('statusTxt'), led=$('led');
  b.classList.remove('conn');
  switch(st){
    case 'CONNECTED': b.classList.add('conn'); l.textContent='Detener'; stT.textContent='Conectado'; led.style.background='#22C55E'; break;
    case 'CONNECTING': l.textContent='Conectando…'; stT.textContent='Conectando'; led.style.background='#F59E0B'; break;
    case 'AUTH': l.textContent='Autenticando…'; stT.textContent='Autenticando'; led.style.background='#F59E0B'; break;
    case 'AUTH_FAILED': l.textContent='Reintentar'; stT.textContent='Auth fallida'; led.style.background='#EF4444'; break;
    case 'NO_NETWORK': l.textContent='Sin red'; stT.textContent='Sin red'; led.style.background='#EF4444'; break;
    default: l.textContent='Conectar'; stT.textContent='Inactivo'; led.style.background='#6E63A6';
  }
}

/* Eventos que la app invoca */
window.mxtunnel={
  onStatus:function(st){ aplicarEstado(st); },
  onServerApplied:function(name){ if(name) $('srvName').textContent=name; },
  onConfigUpdated:function(){ actualizarSrvActual(); toast('Config actualizada'); },
  onLog:function(){ if($('logModal').classList.contains('open')) cargarLogs(); },
  onToast:function(msg){ if(msg) toast(msg); }
};

function actualizarSrvActual(){
  try{
    var raw=MXTunnel.getSelectedServer();
    var d=raw?JSON.parse(raw):null;
    $('srvName').textContent=(d&&d.name)?d.name:'Seleccionar servidor';
  }catch(e){}
}

$('btnPower').addEventListener('click',function(){
  if(estado==='CONNECTED'){ MXTunnel.disconnect(); }
  else { MXTunnel.connect(); }
});
$('cardServer').addEventListener('click',abrirServidores);

function loadAcct(){
  try{ $('inUser').value=MXTunnel.getAccountUser()||''; }catch(e){}
  try{ $('inPass').value=MXTunnel.getAccountPass()||''; }catch(e){}
}
$('inUser').addEventListener('input',function(){ MXTunnel.setAccountUser(this.value.trim()); });
$('inPass').addEventListener('input',function(){ MXTunnel.setAccountPass(this.value); });

$('btnUpdate').addEventListener('click',function(){ MXTunnel.update(); });
$('btnMenu').addEventListener('click',function(){ $('menuModal').classList.add('open'); });
$('menuClose').addEventListener('click',function(){ $('menuModal').classList.remove('open'); });
document.querySelectorAll('#menuModal .m-item').forEach(function(el){
  el.addEventListener('click',function(){
    $('menuModal').classList.remove('open');
    var a=this.dataset.act;
    var map={settings:MXTunnel.openSettings,language:MXTunnel.openLanguage,dns:MXTunnel.openDns,udp:MXTunnel.openUdp,ping:MXTunnel.openPing,battery:MXTunnel.openBattery,hwid:MXTunnel.openHwid,restore:MXTunnel.restoreDefault,exit:MXTunnel.exitApp};
    if(map[a]) map[a]();
  });
});

function abrirServidores(){
  $('srvList').innerHTML='<div class="empty">Cargando…</div>';
  $('srvModal').classList.add('open');
  setTimeout(renderServidores,50);
}
function renderServidores(){
  var html='';
  try{
    var raw=MXTunnel.getConfig();
    if(!raw){ $('srvList').innerHTML='<div class="empty">No hay servidores</div>'; return; }
    var d=JSON.parse(raw);
    var cats=d.categories||[]; var srv=d.servers||[];
    var act;
    try{ act=JSON.parse(MXTunnel.getSelectedServer()||'null'); }catch(e){ act=null; }
    cats.forEach(function(c){
      var items=srv.filter(function(s){ return String(s.category_id)===String(c.id); });
      if(!items.length) return;
      html+='<div class="cat">'+c.name+'</div>';
      items.forEach(function(s){
        var sel=act&&act.id===s.id;
        html+='<div class="srv" data-id="'+s.id+'"><div><div class="nm">'+s.name+(sel?' &#10003;':'')+'</div><div class="ct">'+(c.name||'')+'</div></div></div>';
      });
    });
    if(!srv.length) html='<div class="empty">No hay servidores</div>';
  }catch(e){ html='<div class="empty">Sin datos</div>'; }
  $('srvList').innerHTML=html;
  $('srvList').querySelectorAll('.srv').forEach(function(el){
    el.addEventListener('click',function(){ MXTunnel.applyServer(parseInt(this.dataset.id,10)); cerrarServidores(); });
  });
}
function cerrarServidores(){ $('srvModal').classList.remove('open'); }
$('srvClose').addEventListener('click',cerrarServidores);
$('srvModal').addEventListener('click',function(e){ if(e.target===this) cerrarServidores(); });

function cargarLogs(){
  var list=$('logList');
  try{
    var raw=MXTunnel.getLogs();
    var arr=raw?JSON.parse(raw):[];
    if(!arr.length){ list.innerHTML='<div class="empty">Sin logs</div>'; return; }
    list.innerHTML=arr.map(function(l){ return '<div class="log">'+l+'</div>'; }).join('');
    list.scrollTop=list.scrollHeight;
  }catch(e){ list.innerHTML='<div class="empty">Sin logs</div>'; }
}
$('navLogs').addEventListener('click',function(){ $('logModal').classList.add('open'); cargarLogs(); $('navLogs').classList.add('active'); $('navHome').classList.remove('active'); });
$('navHome').addEventListener('click',function(){ $('logModal').classList.remove('open'); $('navHome').classList.add('active'); $('navLogs').classList.remove('active'); });
$('logClose').addEventListener('click',function(){ $('logModal').classList.remove('open'); $('navHome').classList.add('active'); $('navLogs').classList.remove('active'); });
$('logClear').addEventListener('click',function(){ MXTunnel.clearLogs(); cargarLogs(); });

/* Init: colorea la barra de estado + handshake obligatorio */
try{ MXTunnel.setStatusBarColor('#0E0A1F'); }catch(e){}
aplicarEstado('DISCONNECTED');
loadAcct();
actualizarSrvActual();
try{ MXTunnel.onReady(); }catch(e){}
})();
</script>
</body>
</html>
